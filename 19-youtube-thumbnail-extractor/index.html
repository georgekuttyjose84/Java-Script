<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture in Picture</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> YouTube Thumbnail Extractor</h1>
        <label for="url">YouTube URL</label>
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <button id="extract" class="extract">Extract</button>
        <div class="youtube-container hide" >
            <div class="youtube-image" id="result">
                <img src="" alt="youtube" id="image">
            </div>

            <button id="download" class="extract">Download</button>
        </div>

    </div>
<script src="script.js"></script>
</body>
</html>
